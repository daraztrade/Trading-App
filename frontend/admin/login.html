<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daraz Trade - Admin & Guard Portal</title>
  <link rel="stylesheet" href="/shared/theme.css" />
  <script src="/shared/dialog.js"></script>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23ee4d07'/><path d='M22 72 L44 50 L58 62 L78 34' stroke='%23ffffff' stroke-width='9' stroke-linecap='round' stroke-linejoin='round' fill='none'/><polyline points='64,34 78,34 78,48' stroke='%23ffffff' stroke-width='9' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at top, #181f38 0%, var(--bg-main) 70%);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 32px 26px;
    }
    .badge {
      display: inline-block;
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
    }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 0.82rem; color: var(--text-muted); margin-bottom: 6px; }
    .field input {
      width: 100%;
      padding: 11px 12px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-main);
    }
    .err {
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--color-danger);
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.84rem;
      margin-bottom: 14px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="badge">STAFF & GUARD PORTAL</div>
    <h2 style="margin-bottom: 4px;">Admin Sign In</h2>
    <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px;">Restricted to Main Admin & Sub-Admin Guards</p>

    <div id="errBox" class="err"></div>

    <form id="adminLoginForm">
      <div class="field">
        <label>Staff Username or Email</label>
        <input type="text" id="staffUser" placeholder="mainadmin" required />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="staffPass" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn-secondary" style="width: 100%; margin-top: 6px;">Access Command Center</button>
    </form>
  </div>

  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          login: document.getElementById('staffUser').value.trim(),
          password: document.getElementById('staffPass').value,
          portal: 'ADMIN'
        })
      });
      const data = await res.json();
      if (!res.ok) {
        const box = document.getElementById('errBox');
        box.textContent = data.error;
        box.style.display = 'block';
        return;
      }
      localStorage.setItem('staffUser', JSON.stringify(data.user));
      window.location.href = './dashboard.html';
    });
  </script>
</body>
</html>
