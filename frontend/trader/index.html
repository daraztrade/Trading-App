<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0b0e14" />
  <title>Daraz Trade</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/shared/theme.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23ee4d07'/><path d='M22 72 L44 50 L58 62 L78 34' stroke='%23ffffff' stroke-width='9' stroke-linecap='round' stroke-linejoin='round' fill='none'/><polyline points='64,34 78,34 78,48' stroke='%23ffffff' stroke-width='9' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>" />
  <style>
    .pass-wrap { position: relative; }
.pass-wrap input { padding-right: 42px; }
.pass-toggle {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 1rem;
  padding: 4px;
}
.pass-toggle:hover { color: #fff; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at top, #131d31 0%, var(--bg-main) 65%);
    }
    .auth-box {
      width: 100%;
      max-width: 480px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 32px 26px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .brand-header { text-align: center; margin-bottom: 24px; }
    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--color-primary);
      letter-spacing: 0.5px;
    }
    .brand-header h2 { margin-top: 10px; font-size: 1.45rem; }
    .brand-header p { color: var(--text-muted); font-size: 0.9rem; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); }
    .field input, .field select {
      width: 100%;
      padding: 11px 12px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-size: 0.92rem;
    }
    .phone-group { display: flex; gap: 8px; }
    .phone-code { width: 82px !important; text-align: center; font-weight: 700; color: var(--color-primary) !important; }
    .alert {
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      margin-bottom: 14px;
      display: none;
    }
    .alert.error { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--color-danger); color: #fca5a5; }
    .switch-link { text-align: center; margin-top: 18px; font-size: 0.88rem; color: var(--text-muted); }
    .switch-link a { color: var(--color-secondary); font-weight: 700; cursor: pointer; text-decoration: none; }
    .install-banner { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border-color); text-align: center; }
    @media (max-width: 520px) {
      body {
        padding: 14px 14px calc(18px + env(safe-area-inset-bottom));
        align-items: flex-start;
        padding-top: max(28px, env(safe-area-inset-top));
      }
      .auth-box { padding: 22px 16px; border-radius: 14px; width: 100%; }
      .grid-2 { grid-template-columns: 1fr; }
      .field input, .field select { min-height: 44px; font-size: 16px; }
      .brand-header h2 { font-size: 1.25rem; }
      .phone-group { flex-wrap: nowrap; }
      .phone-code { width: 72px !important; flex-shrink: 0; }
    }
    @media (max-width: 360px) {
      .auth-box { padding: 18px 12px; }
      .brand-logo { font-size: 1.25rem; }
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="auth-box">
    <div class="brand-header">
      <div class="brand-logo">📈 Daraz Trade</div>
      <h2 id="formTitle">Create Your Account</h2>
      <p id="formSubtitle">Join now and start your investment journey</p>
    </div>

    <div id="alertBox" class="alert error"></div>

    <form id="registerForm">
      <div class="grid-2">
        <div class="field">
          <label>Username</label>
          <input type="text" id="regUsername" placeholder="e.g. Ahmed or ali_khan" minlength="3" maxlength="24" required />
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="regEmail" placeholder="you@example.com" required />
        </div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label>Country</label>
          <select id="regCountry" onchange="syncCountryDefaults()">
            <option value="Pakistan" data-code="+92" selected>Pakistan</option>
            <option value="India" data-code="+91">India</option>
            <option value="Bangladesh" data-code="+880">Bangladesh</option>
            <option value="UAE" data-code="+971">United Arab Emirates</option>
            <option value="United Kingdom" data-code="+44">United Kingdom</option>
            <option value="United States" data-code="+1">United States</option>
          </select>
        </div>
        <div class="field">
          <label>Preferred Currency</label>
          <select id="regCurrency">
            <option value="PKR" selected>PKR (Rs)</option>
            <option value="USDT">USDT ($)</option>
            <option value="BTC">BTC (₿)</option>
            <option value="ETH">ETH (Ξ)</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>Mobile Number</label>
        <div class="phone-group">
          <input type="text" id="regPhoneCode" class="phone-code" value="+92" readonly />
          <input type="tel" id="regMobile" placeholder="3001234567" required />
        </div>
      </div>

      <div class="field">
        <label>Invitation Code (Optional)</label>
        <input type="text" id="regInvite" placeholder="Referral code" />
      </div>

<!-- Register Password -->
<div class="field">
  <label>Password</label>
  <div class="pass-wrap">
    <input type="password" id="regPassword" placeholder="Min 6 characters" minlength="6" required />
    <button type="button" class="pass-toggle" onclick="togglePass('regPassword', this)" aria-label="Show password">👁️</button>
  </div>
</div>

<!-- Register Confirm Password -->
<div class="field">
  <label>Confirm Password</label>
  <div class="pass-wrap">
    <input type="password" id="regConfirm" placeholder="Repeat password" minlength="6" required />
    <button type="button" class="pass-toggle" onclick="togglePass('regConfirm', this)" aria-label="Show password">👁️</button>
  </div>
</div>

      <button type="submit" class="btn-secondary" style="width: 100%; margin-top: 6px;">Create Account</button>

      <div class="switch-link">
        Already have an account? <a onclick="toggleMode('LOGIN')">Sign In</a>
      </div>
    </form>

    <form id="loginForm" class="hidden">
      <div class="field">
        <label>Username or Email</label>
        <input type="text" id="loginUser" placeholder="Enter username or email" required />
      </div>
<!-- Login Password -->
<div class="field">
  <label>Password</label>
  <div class="pass-wrap">
    <input type="password" id="loginPass" placeholder="••••••••" required />
    <button type="button" class="pass-toggle" onclick="togglePass('loginPass', this)" aria-label="Show password">👁️</button>
  </div>
</div>
      <button type="submit" class="btn-secondary" style="width: 100%; margin-top: 6px;">Sign In</button>

      <div class="switch-link">
        Don't have an account? <a onclick="toggleMode('REGISTER')">Create Account</a>
      </div>
    </form>

    <form id="profileForm" class="hidden">
      <div style="background: rgba(59, 130, 246, 0.15); border: 1px solid var(--color-info); padding: 14px; border-radius: var(--radius-sm); margin-bottom: 16px;">
        <strong style="color: #93c5fd;">Complete your profile</strong>
        <p style="font-size: 0.83rem; color: var(--text-muted); margin-top: 4px;">Provide your legal first and last name to continue.</p>
      </div>
      <div class="grid-2">
        <div class="field">
          <label>First Name *</label>
          <input type="text" id="profFirst" minlength="2" required />
        </div>
        <div class="field">
          <label>Last Name *</label>
          <input type="text" id="profLast" minlength="2" required />
        </div>
      </div>
      <button type="submit" class="btn-primary" style="width: 100%;">Submit & Enter Dashboard</button>
    </form>

    <div class="install-banner">
      <button type="button" id="installAppBtn" class="btn-primary" style="font-size: 0.82rem; padding: 8px 14px;" onclick="triggerInstall()">
        📲 Download Daraz Trade App
      </button>
    </div>
  </div>

  <script>
    function togglePass(inputId, btn) {
  const inp = document.getElementById(inputId);
  const isHidden = inp.type === 'password';
  inp.type = isHidden ? 'text' : 'password';
  btn.textContent = isHidden ? '🙈' : '👁️';
}
    if (localStorage.getItem('traderUser') && localStorage.getItem('traderToken')) {
      window.location.href = '/dashboard.html';
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => {
        regs.forEach((r) => r.unregister());
      }).catch(() => {});
    }

    async function loadCurrencies() {
      const fallback = [
        { code: 'PKR', symbol: 'Rs' },
        { code: 'USDT', symbol: '$' },
        { code: 'BTC', symbol: '₿' },
        { code: 'ETH', symbol: 'Ξ' }
      ];
      let list = fallback;
      try {
        const res = await fetch('/api/public/config');
        const data = await res.json();
        if (Array.isArray(data.currencies) && data.currencies.length) {
          list = data.currencies;
        }
      } catch (e) {}

      // Always ensure PKR exists and is selected by default.
      if (!list.some((c) => String(c.code).toUpperCase() === 'PKR')) {
        list = [{ code: 'PKR', symbol: 'Rs' }, ...list];
      }
      const preferred = String((list.find((c) => String(c.code).toUpperCase() === 'PKR') || list[0]).code).toUpperCase();
      const sel = document.getElementById('regCurrency');
      sel.innerHTML = list.map((c) => {
        const code = String(c.code || '').toUpperCase();
        const symbol = c.symbol || code;
        return `<option value="${code}">${code} (${symbol})</option>`;
      }).join('');
      sel.value = preferred;
    }
    loadCurrencies();

    function syncCountryDefaults() {
      const sel = document.getElementById('regCountry');
      const opt = sel.options[sel.selectedIndex];
      document.getElementById('regPhoneCode').value = opt.dataset.code;
    }

    function showError(msg) {
      const box = document.getElementById('alertBox');
      box.textContent = msg;
      box.style.display = 'block';
    }

    function toggleMode(mode) {
      document.getElementById('alertBox').style.display = 'none';
      document.getElementById('registerForm').classList.toggle('hidden', mode !== 'REGISTER');
      document.getElementById('loginForm').classList.toggle('hidden', mode !== 'LOGIN');
      document.getElementById('profileForm').classList.add('hidden');
      document.getElementById('formTitle').textContent = mode === 'LOGIN' ? 'Welcome Back' : 'Create Your Account';
      document.getElementById('formSubtitle').textContent = mode === 'LOGIN' ? 'Sign in to access your trading dashboard' : 'Join now and start your investment journey';
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('regUsername').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const mobileDigits = document.getElementById('regMobile').value.trim().replace(/[^\d]/g, '');
      const password = document.getElementById('regPassword').value;

      const normalizedUser = username.replace(/\s+/g, ' ');
      if (
        normalizedUser.length < 3 ||
        normalizedUser.length > 24 ||
        !/^[a-zA-Z][a-zA-Z0-9._\- ]*$/.test(normalizedUser)
      ) {
        return showError('Username must be 3–24 characters. Letters are enough — numbers or symbols are optional.');
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
        return showError('Please enter a valid email address.');
      }
      if (mobileDigits.length < 7 || mobileDigits.length > 13) {
        return showError('Please enter a valid mobile number.');
      }
      if (password.length < 6) {
        return showError('Password must be at least 6 characters.');
      }
      if (password !== document.getElementById('regConfirm').value) {
        return showError('Passwords do not match.');
      }

      const payload = {
        username: normalizedUser,
        email,
        country: document.getElementById('regCountry').value,
        mobile: document.getElementById('regPhoneCode').value + mobileDigits,
        currency: document.getElementById('regCurrency').value,
        invitationCode: document.getElementById('regInvite').value.trim(),
        password
      };

      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) return showError(data.error);

      localStorage.setItem('traderUser', JSON.stringify(data.user));
      if (data.token) localStorage.setItem('traderToken', data.token);
      document.getElementById('registerForm').classList.add('hidden');
      document.getElementById('profileForm').classList.remove('hidden');
      document.getElementById('formTitle').textContent = 'Almost Done';
      document.getElementById('formSubtitle').textContent = 'Verify your identity details';
    });

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = JSON.parse(localStorage.getItem('traderUser'));
      const res = await fetch('/api/auth/complete-profile', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-user-id': user.id,
          'x-session-token': localStorage.getItem('traderToken') || ''
        },
        body: JSON.stringify({
          firstName: document.getElementById('profFirst').value.trim(),
          lastName: document.getElementById('profLast').value.trim()
        })
      });
      const data = await res.json();
      if (!res.ok) return showError(data.error);
      localStorage.setItem('traderUser', JSON.stringify(data.user));
      window.location.href = '/dashboard.html';
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          login: document.getElementById('loginUser').value.trim(),
          password: document.getElementById('loginPass').value,
          portal: 'TRADER'
        })
      });
      const data = await res.json();
      if (!res.ok) return showError(data.error);
      localStorage.setItem('traderUser', JSON.stringify(data.user));
      if (data.token) localStorage.setItem('traderToken', data.token);
      window.location.href = '/dashboard.html';
    });

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });
    function triggerInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
      } else {
        showError('Tap browser Menu (⋮) → "Add to Home Screen" to install Daraz Trade.');
      }
    }

    const refParam = new URLSearchParams(window.location.search).get('ref');
    if (refParam && document.getElementById('regInvite')) {
      document.getElementById('regInvite').value = refParam;
    }
  </script>
</body>
</html>
